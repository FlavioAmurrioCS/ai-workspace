StylesPath = styles
MinAlertLevel = suggestion
Vocab = Project

Packages = Google, ai-tells, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip

[*.md]
BasedOnStyles = Vale, Google, ai-tells

[formats]
COMMIT_EDITMSG = md

[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG}]
